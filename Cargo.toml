[workspace]
resolver = "2"
members = [
  "crates/bridge-core",
  "crates/setup-wizard",
  "src-tauri",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Mstrq4/claude-switch-pro"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
