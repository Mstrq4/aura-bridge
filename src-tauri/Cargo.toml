[package]
name = "claude-switch-pro"
version = "2.1.0"
description = "Unified Aura Desktop Control Center & Embedded Responses Bridge"
authors = ["Mstrq4"]
license = "MIT"
repository = "https://github.com/Mstrq4/aura-bridge"
edition = "2021"

[lib]
name = "claude_switch_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-switch-pro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
claude-bridge-core = { path = "../crates/bridge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }

